name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21  
      uses: actions/setup-java@v4
      with:
        java-version: '21'  
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Generate Javadoc
      run: mvn javadoc:javadoc
      
    - name: Prepare docs
      run: |
        mkdir -p _site
        echo '<html><body><h1>RetroChat Docs</h1><p><a href="javadoc/">Javadoc</a></p></body></html>' > _site/index.html
        cp -r target/site/apidocs/ _site/javadoc/ || echo "No javadoc found"
        
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site/
        
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
