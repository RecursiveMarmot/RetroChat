# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  checks: write
  security-events: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21  
      uses: actions/setup-java@v4
      with:
        java-version: '21'  
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    # 生成 Javadoc 文档
    - name: Generate Javadoc
      run: mvn javadoc:javadoc
      
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      
    # 准备 GitHub Pages 内容
    - name: Prepare GitHub Pages content
      run: |
        # 创建主目录
        mkdir -p _site
        # 创建简单的首页
        cat > _site/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RetroChat Backend Documentation</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                    line-height: 1.6;
                    max-width: 800px;
                    margin: 0 auto;
                    padding: 20px;
                    color: #333;
                }
                header {
                    text-align: center;
                    margin-bottom: 40px;
                    padding-bottom: 20px;
                    border-bottom: 2px solid #f0f0f0;
                }
                h1 {
                    color: #24292e;
                }
                .card {
                    background: #f6f8fa;
                    border: 1px solid #e1e4e8;
                    border-radius: 6px;
                    padding: 20px;
                    margin: 20px 0;
                }
                .card h2 {
                    margin-top: 0;
                    color: #0366d6;
                }
                .btn {
                    display: inline-block;
                    padding: 10px 20px;
                    background: #2ea44f;
                    color: white;
                    text-decoration: none;
                    border-radius: 6px;
                    font-weight: bold;
                    margin: 10px 5px;
                }
                .btn:hover {
                    background: #2c974b;
                }
                .links {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 10px;
                    margin-top: 20px;
                }
                footer {
                    margin-top: 40px;
                    text-align: center;
                    color: #6a737d;
                    font-size: 14px;
                    border-top: 1px solid #eaecef;
                    padding-top: 20px;
                }
            </style>
        </head>
        <body>
            <header>
                <h1>📚 RetroChat Backend Documentation</h1>
                <p>Spring Boot based chat application backend</p>
            </header>
            
            <div class="card">
                <h2>📖 API Documentation</h2>
                <p>Complete Javadoc for all classes and methods in the project.</p>
                <a href="javadoc/" class="btn">View Javadoc</a>
            </div>
            
            <div class="card">
                <h2>⚙️ Project Information</h2>
                <p><strong>Technology Stack:</strong></p>
                <ul>
                    <li>Java 21</li>
                    <li>Spring Boot 3.5.6</li>
                    <li>Maven</li>
                </ul>
                <div class="links">
                    <a href="https://github.com/${{ github.repository }}" class="btn">GitHub Repository</a>
                    <a href="https://github.com/${{ github.repository }}/actions" class="btn">Build Status</a>
                </div>
            </div>
            
            <div class="card">
                <h2>🚀 Quick Start</h2>
                <pre><code># Clone repository
git clone https://github.com/${{ github.repository }}.git

# Build project
mvn clean package

# Run application
mvn spring-boot:run</code></pre>
            </div>
            
            <footer>
                <p>Documentation generated on: $(date +'%Y-%m-%d %H:%M:%S')</p>
                <p>Build: <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            </footer>
        </body>
        </html>
        EOF
        
        # 复制 Javadoc 到子目录
        if [ -d "target/site/apidocs" ]; then
            cp -r target/site/apidocs/ _site/javadoc/
            echo "✅ Javadoc copied to _site/javadoc/"
        else
            echo "⚠️ Javadoc not found at target/site/apidocs/"
        fi
        
    # 上传到 GitHub Pages Artifact
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site/
        
  # 部署到 GitHub Pages（仅在主分支推送时）
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build  # 依赖 build 任务
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
