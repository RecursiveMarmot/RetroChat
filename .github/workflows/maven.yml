name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21  
      uses: actions/setup-java@v4
      with:
        java-version: '21'  
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B clean compile package
      
    # 使用忽略错误的 Javadoc 生成
    - name: Generate Javadoc
      run: mvn javadoc:javadoc -DfailOnError=false || echo "Javadoc generated with warnings"
      
    - name: Prepare docs
      run: |
        mkdir -p _site
        echo '<html>
        <head>
            <title>RetroChat Documentation</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                h1 { color: #333; }
                .box { background: #f5f5f5; padding: 20px; border-radius: 5px; margin: 20px 0; }
                a { color: #0366d6; text-decoration: none; }
                a:hover { text-decoration: underline; }
            </style>
        </head>
        <body>
            <h1>RetroChat Backend Documentation</h1>
            <div class="box">
                <h2>📖 API Documentation</h2>
                <p><a href="javadoc/">View Javadoc</a> - Auto-generated API documentation</p>
            </div>
            <p>Documentation generated on GitHub Actions.</p>
        </body>
        </html>' > _site/index.html
        
        # 检查 javadoc 是否存在
        if [ -d "target/apidocs" ]; then
          cp -r target/apidocs/ _site/javadoc/
        elif [ -d "target/site/apidocs" ]; then
          cp -r target/site/apidocs/ _site/javadoc/
        else
          echo "Creating placeholder javadoc"
          mkdir -p _site/javadoc
          echo '<html><body><h2>Javadoc</h2><p>API documentation would be here. Lombok annotations may prevent full generation.</p></body></html>' > _site/javadoc/index.html
        fi
        
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site/
        
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
